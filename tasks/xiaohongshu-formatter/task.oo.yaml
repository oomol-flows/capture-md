inputs_def:
  - handle: content
    description: "%input-text-content-to-format%"
    json_schema:
      type: string
      ui:widget: text
    nullable: false

  - group: Style Options
    collapsed: true
  - handle: add_emojis
    description: "%add-emojis-to-enhance-visual-appeal%"
    json_schema:
      type: boolean
    value: true
    nullable: true
  - handle: use_dividers
    description: "%add-decorative-dividers-between-sections%"
    json_schema:
      type: boolean
    value: true
    nullable: true
  - handle: highlight_keywords
    description: "%highlight-important-keywords-with-formatting%"
    json_schema:
      type: boolean
    value: true
    nullable: true

  - group: LLM Configuration
    collapsed: false
  - handle: llm
    description: "%llm-model-configuration-for-content-formatting%"
    json_schema:
      ui:widget: llm::model
    value:
      model: oomol-chat
      temperature: 0.5
      top_p: 1
      max_tokens: 200000
    nullable: false

outputs_def:
  - handle: formatted_markdown
    description: "%xiaohongshu-style-formatted-markdown-content%"
    json_schema:
      type: string

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%xiaohongshu-formatter%"
icon: ":carbon:document-blank:"
description: "%format-text-content-into-xiaohongshu-style-markdown-with-emojis%"
