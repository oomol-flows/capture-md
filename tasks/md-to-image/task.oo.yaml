inputs_def:
  - handle: markdown_input
    description: "%markdown-content-or-file-path%"
    json_schema:
      type: string
      ui:widget: text
    nullable: false

  - handle: output_path
    description: "%output-image-path%"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: PNG
            extensions:
              - png
        excludeAll: true
    value:
    nullable: true

  - group: Layout Options
    collapsed: true

  - handle: export_mode
    description: "%export-mode-free-auto-height-xhs-3-4-pyq-1290-2796%"
    json_schema:
      type: string
      enum:
        - free
        - xhs
        - pyq
    value:
    nullable: true

  - handle: width
    description: "%image-width-in-pixels-default-640%"
    json_schema:
      type: number
    value:
    nullable: true

  - handle: padding
    description: "%padding-in-pixels-default-40%"
    json_schema:
      type: number
    value:
    nullable: true

  - handle: font_size
    description: "%base-font-size-in-pixels-default-18%"
    json_schema:
      type: number
    value:
    nullable: true

  - group: Background Options
    collapsed: true

  - handle: background_preset
    description: "%background-gradient-preset%"
    json_schema:
      type: string
      enum:
        - purple
        - pink
        - blue
        - green
        - sunset
        - pastel
        - peach
        - rose
    value:
    nullable: true

  - handle: custom_bg_start
    description: "%custom-background-start-color-overrides-preset%"
    json_schema:
      type: string
      ui:widget: color
      ui:options:
        colorType: HEX
    value:
    nullable: true

  - handle: custom_bg_end
    description: "%custom-background-end-color%"
    json_schema:
      type: string
      ui:widget: color
      ui:options:
        colorType: HEX
    value:
    nullable: true

  - handle: gradient_direction
    description: "%gradient-direction%"
    json_schema:
      type: string
      enum:
        - "0deg"
        - "45deg"
        - "90deg"
        - "135deg"
        - "180deg"
        - "270deg"
    value:
    nullable: true

  - group: Font Options
    collapsed: true

  - handle: title_font
    description: "%font-for-titles-headers-chinese-fonts-recommended-for-chinese-co%"
    json_schema:
      type: string
      enum:
        - default
        - NotoSansSC
        - NotoSerifSC
        - Montserrat
        - Poppins
        - PlayfairDisplay
        - Roboto
    value:
    nullable: true

  - handle: body_font
    description: "%font-for-body-text%"
    json_schema:
      type: string
      enum:
        - default
        - NotoSansSC
        - NotoSerifSC
        - Montserrat
        - Poppins
        - PlayfairDisplay
        - Roboto
    value:
    nullable: true

  - group: Advanced Options
    collapsed: true

  - handle: scale
    description: "%export-scale-factor-for-clarity-default-3%"
    json_schema:
      type: number
    value:
    nullable: true

  - handle: enable_math
    description: "%enable-katex-math-support-default-true%"
    json_schema:
      type: boolean
    value:
    nullable: true

  - handle: enable_diagram
    description: "%enable-mermaid-diagram-support-default-true%"
    json_schema:
      type: boolean
    value:
    nullable: true

  - handle: enable_card
    description: "%enable-card-syntax-support-default-true%"
    json_schema:
      type: boolean
    value:
    nullable: true

outputs_def:
  - handle: image_path
    description: "%generated-image-file-path%"
    json_schema:
      type: string

  - handle: image_width
    description: "%generated-image-width%"
    json_schema:
      type: number

  - handle: image_height
    description: "%generated-image-height%"
    json_schema:
      type: number

executor:
  name: nodejs
  options:
    entry: index.ts
    spawn: false

title: "%markdown-to-image%"
icon: ":carbon:image:"
description: "%convert-markdown-to-beautiful-images-with-support-for-math-formu%"
