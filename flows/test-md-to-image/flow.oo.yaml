title: Test MD to Image
description: Test the md-to-image block with various features

nodes:
  - node_id: md-to-image#2
    title: "Markdown to Image #2"
    inputs_from:
      - handle: markdown_input
        value: >
          # Hello Markdown to Image


          This is a **test** of the new styling with white card on gradient background.


          ## Features


          - Beautiful gradient background

          - White content card with shadow

          - Dynamic font sizing

          - Offline resource support


          :::card info

          This is an info card with the new styling!

          :::


          ### Code Example


          ```javascript

          console.log("Hello World");

          ```


          > This is a blockquote with the new color scheme
